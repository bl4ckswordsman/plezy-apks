name: Update F-Droid Repo

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-fdroid-repo:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Resolve release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Download APKs from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p fdroid/repo
          gh release download "$RELEASE_TAG" --pattern "*.apk" --dir fdroid/repo/
          echo "APKs downloaded:"
          ls -lh fdroid/repo/

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > fdroid/keystore.p12

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Install fdroidserver
        run: uv tool install fdroidserver

      - name: Write fdroid config
        env:
          REPO_KEYALIAS: ${{ secrets.REPO_KEYALIAS }}
          KEYPASS: ${{ secrets.KEYPASS }}
          KEYDNAME: ${{ secrets.KEYDNAME }}
        run: |
          {
            echo "repo_url: \"https://bl4ckswordsman.github.io/plezy-apks/fdroid/repo\""
            echo "repo_name: \"bl4ckswordsman/plezy-apks\""
            echo "repo_description: \"Standalone Plezy APKs extracted from upstream releases.\""
            echo "repo_keyalias: \"$REPO_KEYALIAS\""
            echo "keystorepass: \"$KEYPASS\""
            echo "keypass: \"$KEYPASS\""
            echo "keydname: \"$KEYDNAME\""
            echo "keystore: \"keystore.p12\""
          } > fdroid/config.yml
          chmod 0600 fdroid/config.yml

      - name: Write release notes / changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Fetch the upstream release body from edde746/plezy
          RELEASE_BODY=$(gh api repos/edde746/plezy/releases/tags/$RELEASE_TAG | jq -r '.body // ""')

          # 2. Strip markdown formatting (headers, bold, bullets, links, code fences)
          #    and truncate to fdroidserver's 500-char whatsNew limit
          CHANGELOG=$(printf '%s' "$RELEASE_BODY" \
            | sed 's/```[^`]*```//g' \
            | sed 's/`[^`]*`//g' \
            | sed 's/^#+[[:space:]]*//' \
            | sed 's/\*\*\([^*]*\)\*\*/\1/g' \
            | sed 's/\*\([^*]*\)\*/\1/g' \
            | sed 's/!\[.*\](.*)//' \
            | sed 's/\[\([^]]*\)\]([^)]*)/\1/g' \
            | sed '/^[[:space:]]*$/d' \
            | cut -c1-500)

          if [ -z "$CHANGELOG" ]; then
            echo "::warning::Release body is empty — skipping changelog write"
            exit 0
          fi

          # 3. Write as default.txt — fdroidserver uses this as the whatsNew
          #    fallback for repos that have no Builds: entries (binary-only repos).
          #    A versionCode-named file is only read when that versionCode appears
          #    in the app's Builds: list, which we don't maintain.
          CHANGELOG_DIR="fdroid/metadata/com.edde746.plezy/en-US/changelogs"
          mkdir -p "$CHANGELOG_DIR"
          printf '%s' "$CHANGELOG" > "${CHANGELOG_DIR}/default.txt"
          echo "Changelog written to ${CHANGELOG_DIR}/default.txt ($(echo -n "$CHANGELOG" | wc -c) chars)"

      - name: Run fdroid update
        working-directory: ${{ github.workspace }}/fdroid
        run: fdroid update --verbose

      - name: Clean up secrets
        if: always()
        run: rm -f fdroid/keystore.p12 fdroid/config.yml

      - name: Prepare Pages structure
        run: |
          mkdir -p _site/fdroid
          cp -r fdroid/repo _site/fdroid/repo

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
