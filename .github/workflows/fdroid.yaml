name: Update F-Droid Repo

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-fdroid-repo:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Resolve release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Download APKs from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p fdroid/repo
          gh release download "$RELEASE_TAG" --pattern "*.apk" --dir fdroid/repo/
          echo "APKs downloaded:"
          ls -lh fdroid/repo/

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > fdroid/keystore.p12

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Install fdroidserver
        run: uv tool install fdroidserver

      - name: Write fdroid config
        env:
          REPO_KEYALIAS: ${{ secrets.REPO_KEYALIAS }}
          KEYPASS: ${{ secrets.KEYPASS }}
          KEYDNAME: ${{ secrets.KEYDNAME }}
        run: |
          {
            echo "repo_url: \"https://bl4ckswordsman.github.io/plezy-apks/fdroid/repo\""
            echo "repo_name: \"bl4ckswordsman/plezy-apks\""
            echo "repo_description: \"Standalone Plezy APKs extracted from upstream releases.\""
            echo "repo_keyalias: \"$REPO_KEYALIAS\""
            echo "keystorepass: \"$KEYPASS\""
            echo "keypass: \"$KEYPASS\""
            echo "keydname: \"$KEYDNAME\""
            echo "keystore: \"keystore.p12\""
          } > fdroid/config.yml
          chmod 0600 fdroid/config.yml

      - name: Write release notes / changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Locate aapt in the pre-installed Android SDK
          AAPT_PATH=$(find $ANDROID_HOME/build-tools -name aapt | sort -V | tail -n 1)
          if [ -z "$AAPT_PATH" ]; then
            echo "::error::Could not find aapt in Android SDK"
            exit 1
          fi
          
          # 2. Extract the versionCode from one of the downloaded APKs
          APK_FILE=$(find fdroid/repo -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK file found in fdroid/repo"
            exit 1
          fi
          
          VERSION_CODE=$("$AAPT_PATH" dump badging "$APK_FILE" | grep -oP "versionCode='\K[0-9]+")
          echo "Resolved version code: $VERSION_CODE"
          
          # 3. Fetch the upstream release body from edde746/plezy
          RELEASE_BODY=$(gh api repos/edde746/plezy/releases/tags/$RELEASE_TAG | jq -r '.body')
          
          # 4. Create the changelog directory
          CHANGELOG_DIR="fdroid/metadata/com.edde746.plezy/en-US/changelogs"
          mkdir -p "$CHANGELOG_DIR"
          
          # 5. Write the release body to the changelog file
          echo "$RELEASE_BODY" > "${CHANGELOG_DIR}/${VERSION_CODE}.txt"
          echo "Changelog written to ${CHANGELOG_DIR}/${VERSION_CODE}.txt"

      - name: Run fdroid update
        working-directory: ${{ github.workspace }}/fdroid
        run: fdroid update --verbose

      - name: Clean up secrets
        if: always()
        run: rm -f fdroid/keystore.p12 fdroid/config.yml

      - name: Prepare Pages structure
        run: |
          mkdir -p _site/fdroid
          cp -r fdroid/repo _site/fdroid/repo

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
